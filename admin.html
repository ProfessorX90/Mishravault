<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Mishra Vault</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#0f172a;
color:white;
}

/* LOGIN */
#login{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

#login input{
padding:10px;
border-radius:10px;
border:none;
margin:10px;
}

#login button{
padding:10px 20px;
border:none;
background:#2563eb;
color:white;
border-radius:10px;
cursor:pointer;
}

/* PANEL */
#panel{
display:none;
padding:20px;
}

.section{
margin-bottom:40px;
}

.card{
background:white;
color:black;
padding:10px;
border-radius:10px;
margin:10px 0;
}

button{
margin-top:5px;
padding:5px 10px;
border:none;
background:red;
color:white;
border-radius:5px;
cursor:pointer;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<h2>Admin Login</h2>
<input type="password" id="pass" placeholder="Enter password">
<button onclick="login()">Login</button>
</div>

<!-- PANEL -->
<div id="panel">

<h1>⚙ Admin Panel</h1>

<!-- NOTES -->
<div class="section">
<h2>📚 Add Notes</h2>
<input id="nTitle" placeholder="Title">
<input id="nLink" placeholder="Drive Link">
<button onclick="addNote()">Add Note</button>
</div>

<!-- HELP POSTS -->
<div class="section">
<h2>🤝 Help Posts</h2>
<div id="helpPosts"></div>
</div>

<!-- CHAT -->
<div class="section">
<h2>💬 Chat Messages</h2>
<div id="chatBox"></div>
</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

// 🔐 PASSWORD
const ADMIN_PASS = "mishra123";

// LOGIN
function login(){
let p = document.getElementById("pass").value;

if(p === ADMIN_PASS){
document.getElementById("login").style.display="none";
document.getElementById("panel").style.display="block";
}else{
alert("Wrong password");
}
}

// 🔴 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBcUi1VR5y4gb4l0IADOK5axoZhtuZtzU0",
  authDomain: "mishravaultdiscussion.firebaseapp.com",
  projectId: "mishravaultdiscussion",
  storageBucket: "mishravaultdiscussion.firebasestorage.app",
  messagingSenderId: "296480080371",
  appId: "1:296480080371:web:e200ee93cb98bdbdaa1286",
  measurementId: "G-34PWCSSP1G"
};

firebase.initializeApp(firebaseConfig);

// REFERENCES
const helpRef = firebase.database().ref("helpPosts");
const chatRef = firebase.database().ref("chat");
const notesRef = firebase.database().ref("notes");

// ➕ ADD NOTE
function addNote(){

let title = document.getElementById("nTitle").value;
let link = document.getElementById("nLink").value;

if(title==="" || link===""){
alert("Fill all");
return;
}

notesRef.push({title, link});

alert("Added ✅");

}

// 📚 DELETE HELP POST
helpRef.on("child_added", snap=>{

let d = snap.val();
let key = snap.key;

let div = document.createElement("div");
div.className="card";

div.innerHTML = `
<b>${d.title}</b>
<p>${d.desc}</p>
<button onclick="deleteHelp('${key}')">Delete</button>
`;

document.getElementById("helpPosts").appendChild(div);

});

function deleteHelp(id){
firebase.database().ref("helpPosts/"+id).remove();
location.reload();
}

// 💬 DELETE CHAT
chatRef.on("child_added", snap=>{

let d = snap.val();
let key = snap.key;

let div = document.createElement("div");
div.className="card";

div.innerHTML = `
<b>${d.name}</b>: ${d.msg || "Voice"}
<br>
<button onclick="deleteChat('${key}')">Delete</button>
`;

document.getElementById("chatBox").appendChild(div);

});

function deleteChat(id){
firebase.database().ref("chat/"+id).remove();
location.reload();
}

</script>

</body>
</html>
